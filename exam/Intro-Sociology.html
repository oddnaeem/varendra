<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AOL 101 — Root & Branch</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1b2a20;
    --paper:#ffffff;
    --bark:#2f5233;
    --bark-soft:#4a6e4f;
    --moss:#8fae8b;
    --amber:#b9762f;
    --line:#d8ded6;
    --line-soft:#e9ede7;
    --text-dim:#5b6960;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.55;
    padding-bottom:80px;
  }

  /* ---------- Header ---------- */
  header{
    padding:38px 20px 26px;
    border-bottom:1px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--bark);
    font-weight:600;
    margin-bottom:10px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(28px,7vw,40px);
    margin:0 0 6px;
    color:var(--ink);
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:14px;
    color:var(--text-dim);
    max-width:46ch;
  }
  .meta{
    margin-top:18px;
    font-size:12.5px;
    color:var(--text-dim);
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .meta span{white-space:nowrap;}
  .meta b{color:var(--ink); font-weight:600;}

  .toolbar{
    display:flex;
    gap:8px;
    padding:14px 20px;
    border-bottom:1px solid var(--line);
    position:sticky;
    top:0;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    z-index:20;
  }
  .toolbar button{
    font-family:'Inter',sans-serif;
    font-size:12.5px;
    font-weight:600;
    padding:8px 13px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--bark);
    cursor:pointer;
  }
  .toolbar button:active{transform:scale(0.97);}
  .toolbar .progress{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-dim);
  }

  /* ---------- Tree ---------- */
  .tree{
    padding:22px 18px 10px;
    max-width:720px;
    margin:0 auto;
  }
  .node{
    position:relative;
  }
  .node > .row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:13px 10px;
    border-radius:10px;
    cursor:pointer;
    user-select:none;
  }
  .node > .row:active{background:var(--line-soft);}

  .twisty{
    flex:0 0 22px;
    width:22px;height:22px;
    border-radius:6px;
    background:var(--line-soft);
    display:flex;align-items:center;justify-content:center;
    margin-top:2px;
    transition:transform .25s ease, background .2s ease;
    color:var(--bark);
  }
  .twisty svg{width:11px;height:11px;transition:transform .25s ease;}
  .node.open > .row > .twisty{background:var(--bark);color:#fff;}
  .node.open > .row > .twisty svg{transform:rotate(90deg);}

  .node.leaf > .row > .twisty{opacity:0;}

  .label{
    flex:1;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:16.5px;
    color:var(--ink);
    padding-top:1px;
  }
  .node[data-depth="1"] > .row > .label{
    font-size:19px;
    font-weight:600;
  }
  .tag{
    font-size:10px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--amber);
    font-weight:700;
    margin-left:6px;
  }

  .children{
    margin-left:20px;
    padding-left:14px;
    border-left:1.5px solid var(--line);
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .node.open > .children{ /* height set via JS */ }

  .leaf-body{
    padding:2px 12px 16px 42px;
    font-size:14.8px;
    color:#33403a;
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .node.open > .leaf-body{ }

  .leaf-body p{margin:0 0 10px;}
  .leaf-body ul{margin:0 0 10px; padding-left:18px;}
  .leaf-body li{margin-bottom:7px;}
  .leaf-body .quote{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:15.5px;
    color:var(--bark);
    border-left:2px solid var(--moss);
    padding-left:12px;
    margin:6px 0 10px;
  }
  .leaf-body .attrib{
    display:block;
    font-family:'Inter',sans-serif;
    font-style:normal;
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .leaf-body table{
    width:100%;
    border-collapse:collapse;
    font-size:13.3px;
    margin-top:6px;
  }
  .leaf-body th,.leaf-body td{
    text-align:left;
    padding:8px 8px;
    border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  .leaf-body th{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--bark);
  }
  .leaf-body td:first-child{
    font-weight:600;
    white-space:nowrap;
    color:var(--ink);
  }

  /* root trunk mark */
  .root-mark{
    position:absolute;
    left:-18px;
    top:0;
    bottom:0;
    width:2px;
  }

  footer{
    text-align:center;
    font-size:11.5px;
    color:var(--text-dim);
    padding:30px 20px 10px;
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">AOL 101 · Varendra University</div>
  <h1>Introduction to Sociology</h1>
  <div class="sub">Every branch of the lecture, kept in full — tap a branch to grow it open, tap again to fold it back.</div>
  <div class="meta">
    <span>Course: <b>Art of Living (AOL 101)</b></span>
    <span>Lecturer: <b>Sudipto Das Shuvo</b></span>
    <span>Dept: <b>NFE, VU</b></span>
  </div>
</header>

<div class="toolbar">
  <button id="expandAll">Expand all</button>
  <button id="collapseAll">Collapse all</button>
  <div class="progress" id="progress"></div>
</div>

<div class="tree" id="tree"></div>

<footer>Root, trunk, branch, leaf — the whole slide deck, nothing trimmed.</footer>

<script>

const treeEl = document.getElementById('tree');
let leafCount = 0, openLeaf = 0;

function chevron(){
  return `<svg viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function buildNode(item, depth){
  const node = document.createElement('div');
  const hasChildren = !!item.children;
  node.className = 'node' + (hasChildren ? '' : ' leaf');
  node.setAttribute('data-depth', depth);

  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="twisty">${chevron()}</div><div class="label">${item.title}${item.tag ? `<span class="tag">${item.tag}</span>` : ''}</div>`;
  node.appendChild(row);

  let bodyEl;
  if(hasChildren){
    bodyEl = document.createElement('div');
    bodyEl.className = 'children';
    item.children.forEach(child => bodyEl.appendChild(buildNode(child, depth+1)));
  } else {
    leafCount++;
    bodyEl = document.createElement('div');
    bodyEl.className = 'leaf-body';
    bodyEl.innerHTML = item.html;
  }
  node.appendChild(bodyEl);

  row.addEventListener('click', () => toggle(node, bodyEl, hasChildren));

  return node;
}

function measure(bodyEl){
  return bodyEl.scrollHeight;
}

function toggle(node, bodyEl, hasChildren){
  const isOpen = node.classList.contains('open');
  if(isOpen){
    bodyEl.style.maxHeight = bodyEl.scrollHeight + 'px';
    requestAnimationFrame(()=>{ bodyEl.style.maxHeight = '0px'; });
    node.classList.remove('open');
    if(!hasChildren) openLeaf--;
  } else {
    node.classList.add('open');
    bodyEl.style.maxHeight = measure(bodyEl) + 'px';
    if(!hasChildren) openLeaf++;
    // grow ancestors
    let p = node.parentElement;
    while(p && p.classList && p.classList.contains('children')){
      p.style.maxHeight = p.scrollHeight + 'px';
      p = p.parentElement.parentElement;
    }
  }
  updateProgress();
}

DATA.forEach(item => treeEl.appendChild(buildNode(item, 1)));

function updateProgress(){
  document.getElementById('progress').textContent = `${openLeaf} / ${leafCount} branches open`;
}
updateProgress();

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll('.node').forEach(n => {
    if(!n.classList.contains('open')) n.classList.add('open');
  });
  // set heights after all open, deepest first pass twice for nested max-height
  for(let i=0;i<3;i++){
    document.querySelectorAll('.children, .leaf-body').forEach(el => {
      el.style.maxHeight = el.scrollHeight + 'px';
    });
  }
  openLeaf = leafCount;
  updateProgress();
});

document.getElementById('collapseAll').addEventListener('click', () => {
  document.querySelectorAll('.node.open').forEach(n => n.classList.remove('open'));
  document.querySelectorAll('.children, .leaf-body').forEach(el => el.style.maxHeight = '0px');
  openLeaf = 0;
  updateProgress();
});
</script>

</body>
</html>
