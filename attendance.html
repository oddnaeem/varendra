<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>হাজিরা খাতা — NFE, Public Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0F1B2D;
    --bg-deep: #0A1420;
    --surface: #17263D;
    --surface-2: #1E3049;
    --rule: #C9A227;
    --rule-dim: #7A6A2E;
    --parchment: #E8DCC0;
    --present: #3FA66B;
    --present-dim: #234A34;
    --absent: #D6584F;
    --absent-dim: #4A2926;
    --text: #F2EFE6;
    --text-muted: #93A1B5;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: radial-gradient(1200px 600px at 50% -10%, #16283f 0%, var(--bg) 55%, var(--bg-deep) 100%);
    color: var(--text);
    font-family: 'Noto Sans Bengali', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  .wrap{
    max-width: 560px;
    margin: 0 auto;
    padding: env(safe-area-inset-top,0) 16px 0 16px;
  }
  header.top{
    padding: 22px 4px 14px 4px;
    text-align:center;
    border-bottom: 1px solid rgba(201,162,39,0.25);
    margin-bottom: 22px;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--rule);
    text-transform: uppercase;
    font-weight:600;
    margin-bottom:6px;
  }
  h1{
    font-family: 'Noto Serif Bengali', serif;
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px 0;
    color: var(--parchment);
  }
  .subtitle{
    font-size: 13px;
    color: var(--text-muted);
  }

  /* Overall ring */
  .overall{
    display:flex;
    align-items:center;
    gap:18px;
    background: var(--surface);
    border: 1px solid rgba(201,162,39,0.18);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 22px;
  }
  .ring{
    width: 92px; height: 92px;
    border-radius: 50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    position: relative;
    background: conic-gradient(var(--present) calc(var(--pct,0) * 1%), var(--surface-2) 0);
  }
  .ring::before{
    content:"";
    position:absolute;
    width:70px; height:70px;
    border-radius:50%;
    background: var(--surface);
  }
  .ring .val{
    position:relative;
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 19px;
    color: var(--text);
  }
  .overall-info{flex:1;}
  .overall-info .label{font-size:12px; color:var(--text-muted); margin-bottom:2px;}
  .overall-info .figure{
    font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:var(--parchment);
  }
  .target-note{font-size:12px; margin-top:6px;}
  .target-ok{color: var(--present);}
  .target-bad{color: var(--absent);}

  /* subject cards */
  .card{
    background: var(--surface);
    border: 1px solid rgba(201,162,39,0.16);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-head{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom: 10px;
  }
  .code{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 16px;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .pct{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 18px;
  }
  .pct.ok{color: var(--present);}
  .pct.bad{color: var(--absent);}

  .bar{
    position:relative;
    height: 8px;
    border-radius: 5px;
    background: var(--surface-2);
    margin-bottom: 4px;
    overflow: visible;
  }
  .bar-fill{
    height:100%;
    border-radius:5px;
    background: linear-gradient(90deg, var(--rule-dim), var(--rule));
    transition: width 0.35s ease;
  }
  .bar-target{
    position:absolute;
    top:-3px;
    bottom:-3px;
    width:2px;
    background: var(--parchment);
    opacity:0.8;
  }
  .bar-target::after{
    content: attr(data-t);
    position:absolute;
    top:-16px;
    left:50%;
    transform:translateX(-50%);
    font-size:9px;
    color: var(--text-muted);
    white-space:nowrap;
  }
  .counts{
    font-size: 11.5px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .dots{
    display:flex;
    flex-wrap:wrap;
    gap: 5px;
    margin-bottom: 12px;
    min-height: 14px;
  }
  .dot{
    width:11px; height:11px;
    border-radius:50%;
  }
  .dot.present{ background: var(--present); }
  .dot.absent{ background: transparent; border: 2px solid var(--absent); }
  .dots-empty{ font-size:11.5px; color: var(--text-muted); font-style: italic; }

  .actions{
    display:flex;
    gap: 8px;
  }
  button{
    font-family:'Noto Sans Bengali', sans-serif;
    border:none;
    cursor:pointer;
    font-weight:600;
  }
  .btn{
    flex:1;
    padding: 11px 6px;
    border-radius: 10px;
    font-size: 13.5px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition: transform 0.08s ease, opacity 0.15s ease;
  }
  .btn:active{ transform: scale(0.96); }
  .btn-present{ background: var(--present-dim); color: #B9E6C8; border: 1px solid var(--present); }
  .btn-absent{ background: var(--absent-dim); color: #F3C4C0; border: 1px solid var(--absent); }
  .btn-undo{
    flex: 0 0 auto;
    width: 40px;
    background: var(--surface-2);
    color: var(--text-muted);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-undo:disabled{ opacity:0.35; cursor:not-allowed; }

  .card-foot{
    margin-top: 10px;
    text-align:right;
  }
  .link-btn{
    background:none;
    border:none;
    color: var(--rule);
    font-size: 12px;
    padding: 4px 2px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* bulk add panel */
  .bulk{
    display:none;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed rgba(201,162,39,0.25);
    gap: 8px;
    flex-wrap: wrap;
    align-items:center;
  }
  .bulk.open{ display:flex; }
  .bulk input[type=number]{
    width: 64px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
  }
  .bulk select{
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15);
    background: var(--surface-2);
    color: var(--text);
    font-size: 13px;
  }
  .bulk .apply{
    background: var(--rule);
    color: #2a2107;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }

  /* sync status */
  .sync{
    position: fixed;
    bottom: 0; left:0; right:0;
    text-align:center;
    padding: 10px 8px calc(10px + env(safe-area-inset-bottom,0px)) 8px;
    font-size: 11.5px;
    color: var(--text-muted);
    background: linear-gradient(to top, var(--bg-deep) 60%, transparent);
  }
  .sync.saving{ color: var(--rule); }
  .sync.error{ color: var(--absent); }

  .settings-row{
    text-align:center;
    margin: 4px 0 24px 0;
  }
  .settings-row button{
    background:none;
    border: 1px solid rgba(201,162,39,0.3);
    color: var(--text-muted);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 20px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="eyebrow">Varendra University · Public Health · NFE</div>
    <h1>হাজিরা খাতা</h1>
    <div class="subtitle">নিজের উপস্থিতি নিজে রাখো</div>
  </header>

  <div class="overall">
    <div class="ring" id="overallRing"><span class="val" id="overallVal">--%</span></div>
    <div class="overall-info">
      <div class="label">সর্বমোট উপস্থিতি</div>
      <div class="figure" id="overallFig">০ / ০ ক্লাস</div>
      <div class="target-note" id="targetNote">টার্গেট ৮০%</div>
    </div>
  </div>

  <div id="cards"></div>

  <div class="settings-row">
    <button id="targetBtn">টার্গেট % পরিবর্তন করো</button>
  </div>
</div>

<div class="sync" id="syncBar">লোড হচ্ছে…</div>

<script>
const BIN_ID = "6a5bbf2ff5f4af5e29a16049";
const API_KEY = "$2a$10$TbbF6nGTv0MDntsAXFkpv.k/z0seZlFTZ7ZU5FKhJ5NJvonslffi.";
const BASE = "https://api.jsonbin.io/v3/b/" + BIN_ID;

const SUBJECTS = ["NFE 1101","NFE 1103","NFE 1104","NFE 1105","NFE 1107","NFE 1108","AOL 101","ENG 1002"];

let data = null;
let saveTimer = null;

function todayStr(){
  return new Date().toISOString().slice(0,10);
}

function emptyData(){
  const subjects = {};
  SUBJECTS.forEach(s => subjects[s] = { classes: [] });
  return { target: 80, subjects };
}

function ensureShape(d){
  if(!d || typeof d !== 'object') d = {};
  if(typeof d.target !== 'number') d.target = 80;
  if(!d.subjects || typeof d.subjects !== 'object') d.subjects = {};
  SUBJECTS.forEach(s => {
    if(!d.subjects[s] || !Array.isArray(d.subjects[s].classes)){
      d.subjects[s] = { classes: [] };
    }
  });
  return d;
}

async function loadData(){
  setSync('লোড হচ্ছে…', 'saving');
  try{
    const res = await fetch(BASE + "/latest", {
      headers: { "X-Master-Key": API_KEY }
    });
    if(!res.ok) throw new Error("load failed: " + res.status);
    const json = await res.json();
    data = ensureShape(json.record);
    setSync('সব ডেটা সংরক্ষিত ✓');
  }catch(e){
    console.error(e);
    data = emptyData();
    setSync('লোড করা যায়নি, নতুন খাতা শুরু হলো', 'error');
  }
  render();
}

function saveData(){
  clearTimeout(saveTimer);
  setSync('সংরক্ষণ হচ্ছে…', 'saving');
  saveTimer = setTimeout(async () => {
    try{
      const res = await fetch(BASE, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify(data)
      });
      if(!res.ok) throw new Error("save failed: " + res.status);
      setSync('সংরক্ষিত হয়েছে ✓');
    }catch(e){
      console.error(e);
      setSync('সংরক্ষণ ব্যর্থ — ইন্টারনেট চেক করো', 'error');
    }
  }, 450);
}

function setSync(msg, mode){
  const el = document.getElementById('syncBar');
  el.textContent = msg;
  el.className = 'sync' + (mode ? ' ' + mode : '');
}

function stats(classes){
  const total = classes.length;
  const present = classes.filter(c => c.status === 'present').length;
  const pct = total ? Math.round((present/total)*1000)/10 : 0;
  return { total, present, pct };
}

function markAttendance(code, status){
  data.subjects[code].classes.push({ date: todayStr(), status });
  saveData();
  render();
}

function undoLast(code){
  data.subjects[code].classes.pop();
  saveData();
  render();
}

function bulkAdd(code){
  const qtyEl = document.getElementById('bulk-qty-' + code.replace(/\s/g,''));
  const statusEl = document.getElementById('bulk-status-' + code.replace(/\s/g,''));
  const qty = parseInt(qtyEl.value, 10);
  if(!qty || qty < 1) return;
  for(let i=0;i<qty;i++){
    data.subjects[code].classes.push({ date: todayStr(), status: statusEl.value });
  }
  qtyEl.value = '';
  saveData();
  render();
}

function toggleBulk(code){
  const id = 'bulkpanel-' + code.replace(/\s/g,'');
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function changeTarget(){
  const cur = data.target;
  const next = prompt('নতুন টার্গেট % লিখো (যেমন ৮০):', cur);
  if(next === null) return;
  const n = parseFloat(next);
  if(!isNaN(n) && n > 0 && n <= 100){
    data.target = n;
    saveData();
    render();
  }
}

function render(){
  if(!data) return;
  const target = data.target;

  // overall
  let totalAll = 0, presentAll = 0;
  SUBJECTS.forEach(s => {
    const { total, present } = stats(data.subjects[s].classes);
    totalAll += total; presentAll += present;
  });
  const overallPct = totalAll ? Math.round((presentAll/totalAll)*1000)/10 : 0;
  document.getElementById('overallRing').style.setProperty('--pct', overallPct);
  document.getElementById('overallVal').textContent = totalAll ? overallPct + '%' : '--';
  document.getElementById('overallFig').textContent = presentAll + ' / ' + totalAll + ' ক্লাস';
  const note = document.getElementById('targetNote');
  if(totalAll === 0){
    note.textContent = 'টার্গেট ' + target + '% — এখনো ডেটা নেই';
    note.className = 'target-note';
  } else if(overallPct >= target){
    note.textContent = 'টার্গেট ' + target + '% — ঠিক আছে ✓';
    note.className = 'target-note target-ok';
  } else {
    note.textContent = 'টার্গেট ' + target + '% — ' + (target - overallPct).toFixed(1) + '% কম';
    note.className = 'target-note target-bad';
  }

  // cards
  const container = document.getElementById('cards');
  container.innerHTML = '';
  SUBJECTS.forEach(code => {
    const classes = data.subjects[code].classes;
    const { total, present, pct } = stats(classes);
    const safeId = code.replace(/\s/g,'');
    const ok = total === 0 ? true : pct >= target;

    const dotsHtml = classes.length
      ? classes.slice(-40).map(c => `<div class="dot ${c.status}"></div>`).join('')
      : `<div class="dots-empty">এখনো কোনো ক্লাস যোগ করা হয়নি</div>`;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head">
        <span class="code">${code}</span>
        <span class="pct ${ok ? 'ok' : 'bad'}">${total ? pct + '%' : '--'}</span>
      </div>
      <div class="bar">
        <div class="bar-fill" style="width:${Math.min(pct,100)}%"></div>
        <div class="bar-target" data-t="${target}%" style="left:${target}%"></div>
      </div>
      <div class="counts">উপস্থিত ${present} · মোট ${total} ক্লাস</div>
      <div class="dots">${dotsHtml}</div>
      <div class="actions">
        <button class="btn btn-present" onclick="markAttendance('${code}','present')">✓ আজ উপস্থিত</button>
        <button class="btn btn-absent" onclick="markAttendance('${code}','absent')">✕ আজ অনুপস্থিত</button>
        <button class="btn btn-undo" ${classes.length ? '' : 'disabled'} onclick="undoLast('${code}')" title="শেষ এন্ট্রি বাতিল">↩</button>
      </div>
      <div class="card-foot">
        <button class="link-btn" onclick="toggleBulk('${code}')">পুরনো ক্লাস একসাথে যোগ করো</button>
      </div>
      <div class="bulk" id="bulkpanel-${safeId}">
        <input type="number" min="1" id="bulk-qty-${safeId}" placeholder="সংখ্যা">
        <select id="bulk-status-${safeId}">
          <option value="present">উপস্থিত</option>
          <option value="absent">অনুপস্থিত</option>
        </select>
        <button class="apply" onclick="bulkAdd('${code}')">যোগ করো</button>
      </div>
    `;
    container.appendChild(card);
  });
}

document.getElementById('targetBtn').addEventListener('click', changeTarget);

loadData();
</script>
</body>
</html>
